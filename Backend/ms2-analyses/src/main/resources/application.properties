spring.application.name=ms2-analyses
server.port=8082

# --- Base PostgreSQL dediee a MS2 ---
# Creer la base avant de lancer :  CREATE DATABASE ms2_analyses;
spring.datasource.url=jdbc:postgresql://localhost:5432/ms2_analyses
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate cree / met a jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Swagger ---
# Interface : http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
