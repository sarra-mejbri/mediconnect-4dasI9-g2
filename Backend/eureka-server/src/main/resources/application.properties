spring.application.name=eureka
server.port=8762

# Le serveur Eureka autonome n'est ni client ni consommateur de son propre registre.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Seuil réduit pour une seule instance locale; Eureka conserve un seuil minimal
# d'un heartbeat avant de suspendre l'expiration des baux.
# Garder la valeur par défaut (0.85) avec plusieurs instances en production.
eureka.server.enable-self-preservation=true
eureka.server.renewal-percent-threshold=0.25
eureka.server.renewal-threshold-update-interval-ms=10000
