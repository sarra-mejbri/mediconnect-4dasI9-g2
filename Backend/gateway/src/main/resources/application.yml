server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # MS4 - Traitements et rappels
        - id: ms4-traitements
          uri: lb://ms4-traitements
          predicates:
            - Path=/api/treatments/**,/api/prescriptions/**,/api/intakes/**,/api/reminders/**

        # MS5 - Gardes et urgences
        - id: ms5-gardes
          uri: lb://ms5-gardes
          predicates:
            - Path=/api/on-call/**,/api/zones/**,/api/emergency-services/**

        # Chaque membre ajoute sa route ici, sur le même modèle :
        # - id: ms1-medicaments
        #   uri: lb://ms1-medicaments
        #   predicates:
        #     - Path=/api/medications/**,/api/pharmacies/**,/api/reservations/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
