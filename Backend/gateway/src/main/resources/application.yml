server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # MS4 - Traitements et rappels
        - id: ms4-traitements
          uri: lb://ms4-traitements
          predicates:
            - Path=/api/treatments/**,/api/prescriptions/**,/api/intakes/**,/api/reminders/**

        # MS2 - Analyses medicales et laboratoires
        - id: ms2-analyses
          uri: lb://ms2-analyses
          predicates:
            - Path=/api/labs/**,/api/lab-requests/**,/api/analyses/**

        # Chaque membre ajoute sa route ici, sur le même modèle :
        # - id: ms1-medicaments
        #   uri: lb://ms1-medicaments
        #   predicates:
        #     - Path=/api/medications/**,/api/pharmacies/**,/api/reservations/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
