# =====================================================================
# Configuration de MS4 - Traitements et rappels
# =====================================================================

# ---- Base MySQL dédiée à MS4 (créée automatiquement si elle n'existe pas) ----
spring.datasource.url=jdbc:mysql://localhost:3306/ms4_traitements?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- Données de test (data.sql) chargées après la création des tables ----
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---- Information visible sur /actuator/info ----
management.info.env.enabled=true
info.app.name=ms4-traitements
info.app.description=Traitements et rappels
info.config.source=config-server
