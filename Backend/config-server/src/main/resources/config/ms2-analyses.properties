# =====================================================================
# Configuration de MS2 - Analyses medicales et laboratoires
# =====================================================================

# ---- Base PostgreSQL dediee a MS2 ----
# Creer la base avant le premier lancement : CREATE DATABASE ms2_analyses;
spring.datasource.url=jdbc:postgresql://localhost:5432/ms2_analyses
spring.datasource.username=postgres
spring.datasource.password=postgres

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# ---- Information visible sur /actuator/info ----
management.info.env.enabled=true
info.app.name=ms2-analyses
info.app.description=Analyses medicales et laboratoires
info.config.source=config-server
