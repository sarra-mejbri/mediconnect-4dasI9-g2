# Base PostgreSQL dediee a MS5
spring.datasource.url=${MS5_DB_URL:jdbc:postgresql://localhost:5432/ms5_gardes}
spring.datasource.username=${MS5_DB_USERNAME:postgres}
spring.datasource.password=${MS5_DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Informations Actuator
management.info.env.enabled=true
info.app.name=ms5-gardes
info.app.description=Gardes et services d'urgence
info.app.database=PostgreSQL
info.config.source=config-server
